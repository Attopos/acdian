# Generates ACdian.xcodeproj for iPhone and iPad. Run ./ios-build.sh.
# The Mac app does not use this project; it is built by build.sh.
name: ACdian
options:
  bundleIdPrefix: com.acdian
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: DC9UKDP974
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ACdian:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    scheme:
      testTargets:
        - ACdianUITests
    sources:
      - path: Sources/VaultCore.swift
      - path: Sources/PageTrash.swift
      - path: Sources/Modules.swift
      - path: Sources/Components.swift
      - path: Sources/Localization.swift
      - path: Sources/PagesStorage.swift
      - path: Sources/AppModel.swift
      - path: iOS
        excludes:
          - "Generated/**"
      - path: Resources
        buildPhase: resources
        excludes:
          - "vendor/**"
          - "interactive/**"
          - "AppIcon*"
      - path: Resources/vendor
        type: folder
        buildPhase: resources
      - path: Resources/interactive
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acdian.reader
        PRODUCT_NAME: ACdian
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: iOS/Generated/ACdian.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.acdian.reader
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.acdian.reader
    info:
      path: iOS/Generated/Info.plist
      properties:
        CFBundleDisplayName: ACdian
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUbiquitousContainers:
          iCloud.com.acdian.reader:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: ACdian
            NSUbiquitousContainerSupportedFolderLevels: Any
  ACdianUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSUITests
    dependencies:
      - target: ACdian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acdian.reader.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
